name: Monitor Watchdog

# Watches the monitoring, not the services.
#
# Everything else in this estate alerts by exception, and everything else runs on
# GitHub Actions — Upptime's uptime.yml, the social crons, the token-expiry
# alert, the nightly worker drift check. That makes a silent GitHub Actions
# failure invisible: no check runs, nothing turns red, and the status page keeps
# showing green because Upptime generates it. Upptime can't close this gap
# either, since its own "Status Page" check lives inside Upptime.
#
# Three failure modes, all observed or documented:
#
#   1. GitHub DISABLES scheduled workflows after 60 days of repository
#      inactivity. Silently. A quiet status repo stops being monitored and
#      nothing says so.
#   2. A run stuck in `waiting` on an approval gate holds its concurrency group,
#      so no later run of that group can start. This happened for real: a
#      2026-07-21 worker-deploy run sat unapproved for five days, blocked every
#      subsequent deploy, and the only symptom was a red nightly drift check
#      nobody was watching.
#   3. A hung `in_progress` run does the same thing without ever being visible
#      as a failure.
#
# So this job asks the Actions API directly: is every workflow still enabled, has
# every scheduled workflow actually run recently, and is anything stuck?
#
# It then checks in to the social worker's watchdog endpoint. That closes the
# loop in the other direction: the worker runs the same check on a CLOUDFLARE
# cron and emails when these check-ins stop, so a dead GitHub scheduler is caught
# by a system that doesn't depend on GitHub. See worker/src/watchdog.ts.
#
# The check-in means "this workflow ran", NOT "everything is green" — findings
# go to a GitHub issue. Conflating the two would make a watchdog that reports
# problems indistinguishable from one that has died.
#
# Secrets: PIPELINE_PAT for cross-repo Actions reads (a repo-scoped read token;
# GITHUB_TOKEN can only see this repo), plus the existing SOCIAL_WORKER_URL /
# SOCIAL_CRON_SECRET for the check-in.

on:
  schedule:
    - cron: '23 * * * *' # hourly at :23, off the :00 rush
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # Never queue: a watchdog that piles up behind itself becomes the very
  # concurrency trap it exists to detect.
  group: monitor-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      # Cross-repo reads need a PAT; fall back to GITHUB_TOKEN so a missing
      # secret degrades to "this repo only" (and is reported) rather than
      # failing the whole job.
      GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
      HOME_REPO: ${{ github.repository }}
      SOCIAL_WORKER_URL: ${{ secrets.SOCIAL_WORKER_URL }}
      SOCIAL_CRON_SECRET: ${{ secrets.SOCIAL_CRON_SECRET }}
      # Hours a run may sit in waiting/queued before it counts as stuck.
      STUCK_PENDING_HOURS: '2'
      # Hours a run may be in_progress before it counts as hung.
      STUCK_RUNNING_HOURS: '6'
      # Minutes an Upptime run may be older than before its check-in is withheld.
      #
      # Sized against the measured gap distribution, not the 5-minute cron
      # expression. Over 39 intervals of uptime.yml (2026-07-30) the gaps were
      # median 26.6 min, p90 52.9, max 60.1. At 30 minutes the relay was withheld
      # on roughly half of all runs, and four consecutive withheld hourly relays —
      # well inside that distribution — makes the Cloudflare cron email "Upptime
      # has stopped checking in" when Upptime is fine. 90 minutes clears the
      # observed maximum and is still far under the worker's 4h staleAfterMs, so
      # a genuinely dark Upptime still escalates.
      UPPTIME_FRESH_MINUTES: '90'
    steps:
      # The liveness script lives in .github/scripts/, so it has to be on disk.
      - uses: actions/checkout@v5

      - name: Check monitoring liveness
        id: check
        run: bash .github/scripts/watchdog-liveness.sh

      # Check in BEFORE the issue step: the check-in attests that the CHECK ran,
      # which is true regardless of what it found. Putting it after issue
      # management would let a gh-issue API failure masquerade as a dead watchdog
      # and trigger an email about the wrong thing.
      #
      # `if: success()`, NOT `always()`. A crashed check step must NOT check in.
      # With always(), a check that died — Actions API outage, runner failure,
      # anything — still sent a fresh heartbeat reporting zero findings, so the
      # Cloudflare watchdog stayed silent and the outage was invisible from both
      # sides. That is the watchdog actively defeating its own escalation path.
      # Withholding the check-in is what makes the Cloudflare email fire.
      - name: Check in to the Cloudflare watchdog
        if: success()
        env:
          # Passed through env rather than spliced into the script body: step
          # outputs are interpolated by the YAML templater before the shell sees
          # them, so `${{ }}` inside run: is a shell-injection boundary even when
          # the value is first-party.
          FINDING_COUNT: ${{ steps.check.outputs.count }}
          UPPTIME_FRESH: ${{ steps.check.outputs.upptime_fresh }}
        run: |
          set +e -u +o pipefail  # see the note on the first step
          if [ -z "${SOCIAL_WORKER_URL:-}" ] || [ -z "${SOCIAL_CRON_SECRET:-}" ]; then
            echo "::warning::SOCIAL_WORKER_URL / SOCIAL_CRON_SECRET unset — cannot check in"
            exit 0
          fi

          checkin() {
            NAME="$1"; DETAIL="$2"
            CODE=$(curl -s -o /tmp/checkin.json -w '%{http_code}' \
              -X POST "${SOCIAL_WORKER_URL}/api/watchdog/heartbeat" \
              -H "Authorization: Bearer ${SOCIAL_CRON_SECRET}" \
              -H 'Content-Type: application/json' \
              --max-time 30 \
              --data "$(jq -nc --arg n "$NAME" --arg d "$DETAIL" '{name:$n, detail:$d}')")
            echo "check-in ${NAME}: HTTP ${CODE}"
            if [ "$CODE" != "200" ]; then
              cat /tmp/checkin.json 2>/dev/null || true
              # A failed check-in is a warning, not a job failure: the worker
              # will alert on the missing heartbeat by itself, and failing here
              # would just add a second, noisier signal for the same fault.
              echo "::warning::Watchdog check-in for ${NAME} returned HTTP ${CODE}"
            fi
          }

          checkin monitor-watchdog "run ${GITHUB_RUN_ID}: ${FINDING_COUNT:-0} finding(s)"

          if [ "${UPPTIME_FRESH:-no}" = "yes" ]; then
            checkin upptime "relayed by monitor-watchdog run ${GITHUB_RUN_ID}"
          else
            # Deliberately withhold the relay so the worker's Cloudflare cron
            # escalates to email. Upptime being dark is the one failure that
            # cannot be reported by anything running on GitHub Actions.
            echo "::warning::Upptime has not run recently — withholding its check-in so the worker escalates by email"
          fi

      # Also `success()`: on a crashed check, findings.txt is partial and the
      # `count` output is missing entirely, which would read as 0 and AUTO-CLOSE a
      # legitimately open monitoring issue. A failed run plus the withheld
      # check-in above are the signals in that case.
      - name: Open / update / close the watchdog issue
        if: success()
        env:
          # Overrides the job-level PAT deliberately. The PAT exists for
          # cross-repo *reads*; issue writes are same-repo, which the job's
          # `issues: write` already grants to github.token. Running this step on
          # the PAT made the watchdog's first real run go red on
          # "Resource not accessible by personal access token (createIssue)" —
          # findings computed, findings discarded — and no PAT scope needs to
          # exist for a write the default token can already do.
          GH_TOKEN: ${{ github.token }}
          FINDING_COUNT: ${{ steps.check.outputs.count }}
        run: |
          set +e -u +o pipefail  # see the note on the first step
          TITLE="🐕 Monitoring watchdog: monitoring is degraded"

          # The lookup is NOT a pipeline. With pipefail off, `gh issue list`
          # could fail (5xx, rate limit) while jq and head handled the empty
          # stream and exited 0 — so EXISTING came back empty and the failure
          # was indistinguishable from "no issue open". That silently forks
          # both ways: a resolved problem never gets closed, and a live one
          # opens a duplicate issue every hour instead of commenting.
          #
          # --limit too: the default is 30, so once 30 open issues carry the
          # `monitoring` label the watchdog's own issue drops out of the lookup
          # and the same duplicate-forever path opens up.
          LOOKUP_OK=1
          if ! ISSUE_JSON=$(gh issue list --repo "$HOME_REPO" --state open \
               --label monitoring --limit 100 --json number,title 2>lookup-err.txt); then
            LOOKUP_OK=0
            EXISTING=""
            echo "::error::Could not list existing watchdog issues — $(head -c 200 lookup-err.txt | tr -d '\n'). Refusing to create or close anything, to avoid duplicating or prematurely resolving."
          else
            EXISTING=$(printf '%s' "$ISSUE_JSON" \
              | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -n1)
          fi

          COUNT="${FINDING_COUNT:-0}"

          # A failed lookup must not fall through to "no issue exists".
          if [ "$LOOKUP_OK" -eq 0 ]; then
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "::error::Watchdog found ${COUNT} problem(s) but could not reach the issue API — findings were NOT recorded: $(cat findings.txt 2>/dev/null)"
            fi
            exit 1
          fi

          if [ "${COUNT:-0}" -gt 0 ]; then
            BODY=$(printf 'The watchdog found **%s** problem(s) with the monitoring itself.\n\n%s\n\n---\n\nThese are faults in the checks, not in the services they watch: while any of them stands, the corresponding check is not running and its silence means nothing. Opened automatically by `monitor-watchdog.yml` (run %s).\n' \
              "$COUNT" "$(cat findings.txt)" "$GITHUB_RUN_ID")
            if [ -n "$EXISTING" ]; then
              if ! gh issue comment "$EXISTING" --repo "$HOME_REPO" --body "$(printf 'Still degraded — **%s** finding(s):\n\n%s\n\n_(automated re-check, run %s)_\n' "$COUNT" "$(cat findings.txt)" "$GITHUB_RUN_ID")"; then
                echo "::error::Could not comment on watchdog issue #${EXISTING} — findings were NOT recorded: $(cat findings.txt)"
                FAILED=1
              fi
            else
              # Ensure the label exists, then create WITH it and no unlabeled
              # fallback. An unlabeled issue would be invisible to the
              # --label-scoped lookup above, so the next hourly run would open
              # another one — an unlabeled duplicate every hour, forever.
              gh label create monitoring --repo "$HOME_REPO" \
                --description "Faults in the monitoring itself (watchdog findings)" \
                --color 0E8A16 2>/dev/null || true
              # A silently-failed create is the worst outcome here: the findings
              # vanish, the next hourly run finds no EXISTING issue and tries
              # again, and the only trace is a run that reported success. Fail
              # the step so the run goes red — and note that the check-in already
              # happened in the previous step, so this failure surfaces as a red
              # run rather than as a spurious "watchdog is dead" email.
              if ! gh issue create --repo "$HOME_REPO" --title "$TITLE" --body "$BODY" --label monitoring; then
                echo "::error::Could not create the watchdog issue — findings were NOT recorded: $(cat findings.txt)"
                FAILED=1
              fi
            fi
          elif [ -n "$EXISTING" ]; then
            if ! gh issue close "$EXISTING" --repo "$HOME_REPO" \
                 --comment "✅ Monitoring healthy again — all watched workflows enabled, running on schedule, and nothing stuck. Auto-closing."; then
              # Benign compared to the above (a stale-open issue is visible, not
              # silent), but still a lie about state, so it goes red too.
              echo "::error::Could not close resolved watchdog issue #${EXISTING}"
              FAILED=1
            fi
          fi

          exit "${FAILED:-0}"
