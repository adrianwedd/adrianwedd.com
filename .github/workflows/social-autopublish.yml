name: Social Queue Sync

# Date-scheduled social broadcast.
#
# Social posting is NO LONGER fire-on-commit. A post broadcasts when its
# frontmatter `date` arrives, not when it's merged or when `draft` flips.
#
#   date             = WHEN it broadcasts (the drip schedule)
#   autopublish:true = WHETHER it broadcasts at all (deliberate opt-in)
#   draft:false      = whether it's live on the SITE (separate concern)
#
# This job regenerates the date-scheduled queue from content on every
# relevant push to main and syncs it to the worker's KV. The worker's
# hourly cron (`social-cron.yml` -> /api/cron/publish) then publishes each
# entry once its scheduled time is reached. Idempotency is twofold: stable
# ids (`drip-<platform>-<slug>`) plus the worker's `idempotent:<id>` record,
# and the generator never queues a past-dated post -- so a merge can never
# re-broadcast already-sent content.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'src/content/projects/**'
      - 'scripts/generate-social-queue.mjs'
      - 'social/facebook-posts.json'

permissions:
  contents: read

jobs:
  sync-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install frontmatter parser
        run: npm install --no-save gray-matter

      - name: Regenerate date-scheduled queue from content
        run: node scripts/generate-social-queue.mjs

      - name: Sync queue to worker KV (idempotent via content hash)
        env:
          SOCIAL_WORKER_URL: ${{ secrets.SOCIAL_WORKER_URL }}
          SOCIAL_PUBLISH_SECRET: ${{ secrets.SOCIAL_PUBLISH_SECRET }}
        run: |
          COUNT=$(jq '.posts | length' social/facebook-posts.json)
          echo "Queue has $COUNT scheduled entr(y/ies)."
          HASH=$(sha256sum social/facebook-posts.json | cut -d' ' -f1)
          POSTS=$(jq '.posts' social/facebook-posts.json)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SOCIAL_WORKER_URL}/api/queue/sync" \
            -H "Authorization: Bearer ${SOCIAL_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg hash "$HASH" --argjson posts "$POSTS" '{hash: $hash, posts: $posts}')" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Queue sync: HTTP $HTTP_CODE — $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Queue sync returned HTTP $HTTP_CODE"
            exit 1
          fi
