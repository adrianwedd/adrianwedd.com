name: E2E

on:
  pull_request:
    # E2E is not a required check, so a paths-ignore is safe here: a
    # documentation-only PR simply has no browser run to do. src/content/**/*.md
    # is deliberately NOT covered — that markdown is the site.
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *' # nightly ~00:00 AEST

# Least privilege: every job only reads the repo (checkout + artifact upload
# use the job token for nothing else).
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast root unit tests (vitest) — no browser, no build. Runs on every trigger
  # as part of the PR gate; parallel to smoke for quick feedback.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - name: Test private campaign allocation workflow
        run: python3 -m unittest discover -s scripts/on-fire -p 'test_*.py' -v
      - run: npm run check:failure-first-stats
        env:
          # Authenticated api.github.com — unauthenticated is 60/hr per IP and
          # shared runners exhaust it.
          GITHUB_TOKEN: ${{ github.token }}

  # Build once for both browser suites. PRs run smoke; nightly/manual runs also
  # run the full desktop/mobile suite against the same production build.
  smoke:
    runs-on: ubuntu-latest
    # Cold image generation can take ~13 minutes. Allow room for both suites.
    timeout-minutes: 30
    env:
      CI: 'true'
      PUBLIC_GA_MEASUREMENT_ID: G-TESTE2E0000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        id: build
      - name: Check Lighthouse dependency compatibility
        # LHCI's pinned Lighthouse uses a security-updated Puppeteer override.
        # Exercise collection against the real build, using the installed browser.
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          npx lhci collect --staticDistDir=dist --url=/ --numberOfRuns=1 \
            --settings.onlyCategories=performance \
            --settings.chromeFlags="--headless --no-sandbox"
      - run: npm run test:e2e:smoke
        id: smoke
      - name: Run full desktop and mobile suite
        # A smoke/Lighthouse failure must not hide the independent full suite.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        run: npm run test:e2e:full -- --output=test-results-full
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report-full/
          retention-days: 7
