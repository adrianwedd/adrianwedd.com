name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *' # nightly ~00:00 AEST

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every trigger: PR (this is the gate), plus nightly/dispatch so the
  # @smoke lifecycle checks aren't skipped there. The `full` job is non-PR only,
  # so nothing runs twice on a PR.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      PUBLIC_GA_MEASUREMENT_ID: G-TESTE2E0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PUBLIC_GA_MEASUREMENT_ID: G-TESTE2E0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
