name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *' # nightly ~00:00 AEST

# Least privilege: every job only reads the repo (checkout + artifact upload
# use the job token for nothing else).
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast root unit tests (vitest) — no browser, no build. Runs on every trigger
  # as part of the PR gate; parallel to smoke for quick feedback.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

  # Runs on every trigger: PR (this is the gate), plus nightly/dispatch so the
  # @smoke lifecycle checks aren't skipped there. The `full` job is non-PR only,
  # so nothing runs twice on a PR.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      PUBLIC_GA_MEASUREMENT_ID: G-TESTE2E0000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PUBLIC_GA_MEASUREMENT_ID: G-TESTE2E0000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
