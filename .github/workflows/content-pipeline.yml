name: Content Pipeline

on:
  schedule:
    # Run weekly on Sunday at 22:00 UTC
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to run (adhd-research, ai-security, or 'all')"
        required: false
        default: "all"
      max_papers:
        description: "Max papers per topic"
        required: false
        default: "3"
      dry_run:
        description: "Dry run only"
        required: false
        type: boolean
        default: false

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout adrianwedd.com
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adrianwedd.com

      # Requires PIPELINE_PAT secret with read access to adrianwedd/failure-first-embodied-ai
      - name: Checkout failure-first-embodied-ai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adrianwedd/failure-first-embodied-ai
          path: failure-first-embodied-ai
          token: ${{ secrets.PIPELINE_PAT }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install pyyaml==6.0.3 requests==2.34.2

      - name: Determine topics
        id: topics
        env:
          INPUT_TOPIC: ${{ github.event.inputs.topic || 'all' }}
        run: |
          if [ "$INPUT_TOPIC" = "all" ]; then
            echo "topics=adhd-research ai-security" >> "$GITHUB_OUTPUT"
          else
            echo "topics=$INPUT_TOPIC" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight PR-publication capability
        id: preflight
        working-directory: adrianwedd.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fail BEFORE creating any branch. The old workflow discovered this
          # capability was missing only after pushing a fresh timestamped branch,
          # which is how 15 orphans accumulated.
          node scripts/publish-auto-drafts.mjs --preflight

      - name: Run pipeline
        env:
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          INPUT_MAX_PAPERS: ${{ github.event.inputs.max_papers || '3' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PIPELINE_TOPICS: ${{ steps.topics.outputs.topics }}
        working-directory: adrianwedd.com
        run: |
          FAILED=0
          for topic in $PIPELINE_TOPICS; do
            echo "::group::Pipeline: $topic"

            ARGS=(
              ./scripts/content-pipeline.sh
              --topic "$topic"
              --max-papers "$INPUT_MAX_PAPERS"
              --skip-research
            )

            if [ "$INPUT_DRY_RUN" = "true" ]; then
              ARGS+=(--dry-run)
            fi

            chmod +x ./scripts/content-pipeline.sh
            if ! "${ARGS[@]}"; then
              echo "::warning::Pipeline failed for topic: $topic"
              FAILED=$((FAILED + 1))
            fi

            echo "::endgroup::"
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED topic(s) failed"
            exit 1
          fi

      - name: Check for new blog posts
        id: changes
        working-directory: adrianwedd.com
        run: |
          if git diff --quiet -- src/content/blog/ && \
             [ -z "$(git ls-files --others --exclude-standard src/content/blog/)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish candidates to the rolling backlog
        if: steps.changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        working-directory: adrianwedd.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Transaction invariant: a failed PR-publication step must not create an
          # unbounded new remote branch. This used to push a fresh
          # content/auto-drafts-<timestamp> branch and only then run `gh pr create`,
          # which fails here ("GitHub Actions is not permitted to create or approve
          # pull requests"). 15 orphaned branches accumulated before anyone noticed.
          #
          # scripts/publish-auto-drafts.mjs preflights that capability BEFORE pushing
          # anything, publishes to one fixed rolling branch, updates the single
          # rolling PR, dedupes by stable paper identity (DOI/OpenAlex/slug) against
          # data/auto-drafts-seen.json, and no-ops successfully when nothing is new.
          node scripts/publish-auto-drafts.mjs --max-backlog 20

      - name: Report publish outcome
        if: always() && steps.changes.outputs.has_changes == 'true'
        working-directory: adrianwedd.com
        run: |
          if [ -f data/auto-drafts-seen.json ]; then
            echo "durable triage memory: $(node -e '
              const m=require("./data/auto-drafts-seen.json");
              const c=Object.values(m.candidates||{});
              const by={};
              for(const x of c) by[x.state]=(by[x.state]||0)+1;
              console.log(c.length+" candidates "+JSON.stringify(by));
            ')"
          fi
