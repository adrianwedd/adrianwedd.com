name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Astro type check
        run: npx astro check
      - run: npm run lint
      - run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          uploadArtifacts: false
          temporaryPublicStorage: true
          configPath: .github/lighthouse/lighthouserc.json

  worker-csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-csp/package-lock.json
      - name: Install worker CSP dependencies
        run: cd worker-csp && npm ci
      - name: Run worker CSP tests
        run: cd worker-csp && npm test
      - name: Type check worker CSP
        run: cd worker-csp && npx tsc --noEmit
