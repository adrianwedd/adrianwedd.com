name: Lighthouse CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    # Lighthouse runs on-demand only — run it locally with `npm run lighthouse`
    # (same config), or trigger this job manually via the Actions tab.
    # PR validation (astro check, build, worker-csp, etc.) lives in deploy.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Astro type check
        run: npx astro check
      - run: npm run lint
      - run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          uploadArtifacts: false
          temporaryPublicStorage: true
          configPath: .github/lighthouse/lighthouserc.json
