name: Social Token Access Alert

# Page-token data-access timestamps can pass while Page operations remain
# available. Alert on actual token validity, required permissions, and the
# token's own expiry. See #680 for the live verification.
#
# Uses the authenticated Worker health endpoint and opens one issue per
# platform, deduped by the `token-access` label and platform title.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Alert when actual token expiry is within this many days'
        required: false
        default: '7'

permissions:
  contents: none
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SOCIAL_WORKER_URL: ${{ secrets.SOCIAL_WORKER_URL }}
      SOCIAL_CRON_SECRET: ${{ secrets.SOCIAL_CRON_SECRET }}
      THRESHOLD: ${{ github.event.inputs.threshold || '7' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fetch token health
        id: health
        run: |
          # NOTE: no -f/--fail on this curl — a 503 is a VALID response here
          # (worker up, token invalid) and must reach the parsing below.
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${SOCIAL_WORKER_URL}/api/health" \
            -H "Authorization: Bearer ${SOCIAL_CRON_SECRET}" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: $HTTP_CODE"
          # 503 = worker up but an operational check failed — the body still
          # carries the platforms block this job exists to act on.
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "503" ]; then
            echo "::error::Health check returned HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi
          # Guard: an unauthenticated /api/health returns {"ok":true} with no
          # platforms block — treat a missing platforms object as a hard failure
          # so a misconfigured secret cannot silently mask a token problem.
          if ! echo "$BODY" | jq -e '.platforms' >/dev/null 2>&1; then
            echo "::error::Health response has no .platforms block (auth misconfigured?)"
            echo "$BODY"
            exit 1
          fi
          echo "$BODY" > health.json

      - name: Open / update / close access issues
        run: |
          set -euo pipefail
          THRESHOLD="${THRESHOLD:-7}"
          NOW=$(date +%s)

          jq -c '.platforms | to_entries[]' health.json | while IFS= read -r ENTRY; do
              PLATFORM=$(jq -r '.key' <<< "$ENTRY")
              VALID=$(jq -r '.value.tokenValid' <<< "$ENTRY")
              EXPIRES=$(jq -r '.value.tokenExpiresAt // 0' <<< "$ENTRY")
              VERIFIED=$(jq -r 'if (.value | has("permissionsVerified")) then .value.permissionsVerified else true end' <<< "$ENTRY")
              MISSING=$(jq -r '(.value.missingPermissions // []) | join(", ")' <<< "$ENTRY")
              echo "=== ${PLATFORM}: valid=${VALID}, tokenExpiresAt=${EXPIRES}, permissionsVerified=${VERIFIED}, missing=${MISSING}"

              TITLE="🔑 ${PLATFORM} token access needs attention"
              EXISTING=$(gh issue list --repo "$REPO" --state open \
                --label token-access --json number,title \
                | jq -r --arg title "$TITLE" \
                  '.[] | select(.title == $title) | .number' | head -n1)

              REASON=""
              if [ "$VALID" != "true" ]; then REASON="token invalid"; fi
              if [ "$VERIFIED" = "false" ]; then REASON="${REASON:+$REASON; }permissions unverifiable"; fi
              if [ -n "$MISSING" ]; then REASON="${REASON:+$REASON; }missing permissions: $MISSING"; fi
              if [[ "$EXPIRES" =~ ^[0-9]+$ ]] && [ "$EXPIRES" -gt 0 ]; then
                DAYS=$(( (EXPIRES - NOW) / 86400 ))
                if [ "$DAYS" -lt "$THRESHOLD" ]; then
                  REASON="${REASON:+$REASON; }token expires in $DAYS day(s)"
                fi
              fi

              if [ -n "$REASON" ]; then
                BODY=$(printf '**%s** token access needs attention: %s.\n\nInspect the token and Worker operations before renewing. Opened by `social-token-alert.yml`.' "$PLATFORM" "$REASON")
                if [ -n "$EXISTING" ]; then
                  echo "  updating existing issue #${EXISTING}"
                  gh issue comment "$EXISTING" --repo "$REPO" \
                    --body "Token access still needs attention: **${REASON}**. _(automated re-check)_"
                else
                  echo "  opening new issue"
                  gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
                    --label token-access || \
                  gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
                fi
              elif [ -n "$EXISTING" ]; then
                echo "  healthy again; closing #${EXISTING}"
                gh issue close "$EXISTING" --repo "$REPO" \
                  --comment "✅ ${PLATFORM} token valid with required permissions and no imminent token expiry. Auto-closing."
              fi
            done
