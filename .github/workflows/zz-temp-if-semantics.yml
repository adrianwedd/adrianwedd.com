name: TEMP if-semantics probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: check
        id: check
        run: echo "count=3" >> "$GITHUB_OUTPUT"

      - name: issue
        id: issue
        if: success()
        run: |
          set +e -u +o pipefail
          LOST=no
          lost() { LOST=yes; }
          trap 'echo "findings_lost=${LOST}" >> "$GITHUB_OUTPUT"' EXIT
          lost
          echo "::error::simulated issue-write failure"
          exit 1

      - name: checkin
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        env:
          FINDINGS_LOST: ${{ steps.issue.outputs.findings_lost }}
          ISSUE_OUTCOME: ${{ steps.issue.outcome }}
        run: |
          echo "PROBE: this step RAN after the failed issue step"
          echo "PROBE: FINDINGS_LOST='${FINDINGS_LOST}'  ISSUE_OUTCOME='${ISSUE_OUTCOME}'"
