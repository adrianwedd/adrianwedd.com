name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch GA4 analytics data
        run: node scripts/fetch-ga4-data.mjs
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
      - name: Checkout CV data
        uses: actions/checkout@v4
        with:
          repository: adrianwedd/cv
          path: cv-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy CV data
        run: |
          mkdir -p src/data
          if [ -f cv-repo/data/base-cv.json ]; then
            cp cv-repo/data/base-cv.json src/data/base-cv.json
            echo "CV data copied successfully"
          else
            echo "CV data not found, using defaults"
          fi
      - run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      - name: Enforce no raw <img> on local paths
        run: |
          if grep -rn '<img' src/pages/ src/layouts/ src/components/ \
            --include='*.astro' \
            | grep -v 'https\?://' \
            | grep -v 'data:' \
            | grep -v 'src/components/islands/' \
            | grep -v 'src=""' \
            | grep -q .; then
            echo "ERROR: Raw <img> tags with local paths found. Use Astro <Picture> instead."
            grep -rn '<img' src/pages/ src/layouts/ src/components/ \
              --include='*.astro' \
              | grep -v 'https\?://' \
              | grep -v 'data:' \
              | grep -v 'src/components/islands/' \
              | grep -v 'src=""'
            exit 1
          fi
          echo "✓ No raw <img> tags on local paths found."
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --base https://adrianwedd.com
            --exclude-all-private
            --accept 200,206,301,302,303,307,308
            ./dist/**/*.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
