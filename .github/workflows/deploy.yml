name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Astro type check
        run: npx astro check
      - name: Validate content
        run: node scripts/validate-content.js
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Fetch GA4 analytics data
        run: node scripts/fetch-ga4-data.mjs
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
      - name: Checkout CV data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: adrianwedd/cv
          path: cv-repo
          token: ${{ secrets.PIPELINE_PAT || secrets.GITHUB_TOKEN }}

      - name: Copy CV data
        run: |
          mkdir -p src/data
          if [ -f cv-repo/data/base-cv.json ]; then
            cp cv-repo/data/base-cv.json src/data/base-cv.json
            echo "CV data copied successfully"
          else
            echo "CV data not found, using defaults"
          fi
      - run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      - name: Check build size budget
        run: |
          # Check compiled assets only (excludes notebook-assets media files)
          ASTRO_MB=$(du -sm dist/_astro/ | cut -f1)
          echo "dist/_astro/ size: ${ASTRO_MB}MB (budget: 100MB)"
          if [ "$ASTRO_MB" -gt 100 ]; then
            echo "ERROR: dist/_astro/ is ${ASTRO_MB}MB, exceeds 100MB budget"
            exit 1
          fi
          LARGE=$(find dist/_astro -name '*.js' -size +150k 2>/dev/null)
          if [ -n "$LARGE" ]; then
            echo "WARN: Large JS chunks found (>150KB uncompressed):"
            echo "$LARGE" | while read f; do echo "  $(du -sh "$f" | cut -f1)  $f"; done
          fi
          echo "✓ Build size within budget"
      - name: Enforce no raw <img> on local paths
        run: |
          if grep -rn '<img' src/pages/ src/layouts/ src/components/ \
            --include='*.astro' \
            | grep -v 'https\?://' \
            | grep -v 'data:' \
            | grep -v 'src/components/islands/' \
            | grep -v 'src=""' \
            | grep -q .; then
            echo "ERROR: Raw <img> tags with local paths found. Use Astro <Picture> instead."
            grep -rn '<img' src/pages/ src/layouts/ src/components/ \
              --include='*.astro' \
              | grep -v 'https\?://' \
              | grep -v 'data:' \
              | grep -v 'src/components/islands/' \
              | grep -v 'src=""'
            exit 1
          fi
          echo "✓ No raw <img> tags on local paths found."
      - name: Enforce .jpg twin for every .webp heroImage
        run: |
          # FB / X / LinkedIn / iMessage do not reliably scrape WebP og:image.
          # src/pages/blog/[...slug].astro and src/pages/projects/[...slug].astro
          # swap heroImage.webp -> .jpg for og:image, so the .jpg must exist.
          missing=0
          while IFS= read -r webp; do
            jpg="${webp%.webp}.jpg"
            full="public${jpg}"
            if [ ! -f "$full" ]; then
              echo "ERROR: missing OG twin $full (heroImage was $webp)"
              missing=$((missing+1))
            fi
          done < <(grep -rh "^heroImage:" src/content/blog/ src/content/projects/ src/content/audio/ 2>/dev/null \
            | grep -oE "/[^'\" ]+\.webp" | sort -u)
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing heroImage .webp file(s) are missing their .jpg twin"
            echo "Fix: generate a .jpg next to each .webp, e.g."
            echo "  ffmpeg -y -i public/notebook-assets/SLUG/infographic.webp public/notebook-assets/SLUG/infographic.jpg"
            exit 1
          fi
          echo "✓ Every .webp heroImage has a .jpg twin for OG scraping."
      - name: Run worker tests
        # worker-csp has its own dedicated job below; this only covers the
        # social-publish worker, which had no CI coverage prior to this step.
        run: cd worker && npm ci && npm test
      - name: Install lychee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SHA-256 of lychee-v0.23.0 x86_64-unknown-linux-gnu.tar.gz
          # Captured from first successful CI run; pin prevents tampered-asset attacks.
          EXPECTED_SHA256: "PENDING"
        run: |
          gh release download lychee-v0.23.0 \
            --repo lycheeverse/lychee \
            --pattern 'lychee-x86_64-unknown-linux-gnu.tar.gz' \
            --output lychee.tar.gz
          ACTUAL=$(sha256sum lychee.tar.gz | awk '{print $1}')
          echo "sha256: $ACTUAL"
          if [ "$EXPECTED_SHA256" != "PENDING" ] && [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: SHA-256 mismatch — aborting"
            exit 1
          fi
          tar -xzf lychee.tar.gz lychee
          sudo mv lychee /usr/local/bin/lychee
          lychee --version
      - name: Check links
        run: |
          lychee \
            --config .lychee.toml \
            --base https://adrianwedd.com \
            --exclude-all-private \
            --accept 200,206,301,302,303,307,308 \
            ./dist/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check internal links
        # Catches same-origin 404s that Lychee skips (it excludes our own
        # domain to avoid pre-deploy 404s on not-yet-published pages).
        run: npm run check:links
      - name: Run site tests
        run: bash scripts/test-site.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  worker-csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-csp/package-lock.json
      - name: Install worker CSP dependencies
        run: cd worker-csp && npm ci
      - name: Run worker CSP tests
        run: cd worker-csp && npm test
      - name: Type check worker CSP
        run: cd worker-csp && npx tsc --noEmit

  deploy:
    needs: [build, worker-csp]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
