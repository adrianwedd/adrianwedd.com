# Cloudflare Worker that injects per-request CSP nonces into adrianwedd.com responses.
#
# Deploy: cd worker-csp && npx wrangler deploy
# Routes are commented out — uncomment and bind once you've reviewed the policy
# in src/index.ts. The worker is a no-op until a route binds it.

name = "adrianwedd-csp"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Wire to the apex when ready. Leaving commented so deploys don't accidentally
# capture the production hostname before the policy is reviewed end-to-end.
# [[routes]]
# pattern = "adrianwedd.com/*"
# zone_name = "adrianwedd.com"
# [[routes]]
# pattern = "www.adrianwedd.com/*"
# zone_name = "adrianwedd.com"

[vars]
# When STRICT_DYNAMIC=1, script-src uses 'strict-dynamic' alongside the nonce.
# Leave 0 until all dynamically-loaded scripts (Preact hydration, etc.) are
# verified — strict-dynamic disables the host allowlist (the failure mode in #241).
STRICT_DYNAMIC = "0"

[observability]
enabled = true
