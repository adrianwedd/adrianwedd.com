name = "adrianwedd-social"
main = "src/index.ts"
compatibility_date = "2026-03-29"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SOCIAL"
id = "b85557255f9c475abd4af15d4a9dd458"

[[durable_objects.bindings]]
name = "CRON_LOCK"
class_name = "CronLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CronLock"]

[vars]
FACEBOOK_PAGE_ID = "35753603727"
GRAPH_API_VERSION = "v21.0"
INSTAGRAM_BUSINESS_ACCOUNT_ID = ""
BLUESKY_HANDLE = "adrianwedd.com"

# Rate limiting binding (#473): 30 req/min per IP+path across /api/*.
# A zone-level WAF rate-limiting rule would drop abuse before worker code,
# but the Workers binding achieves the same budget without WAF-write access.
# namespace_id is an arbitrary per-worker-unique numeric label, not a KV id.
[[unsafe.bindings]]
name = "API_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
