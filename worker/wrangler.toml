name = "adrianwedd-social"
main = "src/index.ts"
compatibility_date = "2026-03-29"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SOCIAL"
id = "b85557255f9c475abd4af15d4a9dd458"

[[durable_objects.bindings]]
name = "CRON_LOCK"
class_name = "CronLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CronLock"]

# Crisis-alert email (Cloudflare Email Sending), sent to a verified destination
# address — free on any plan, no sending-domain onboarding required. Two rules:
#   1. CRISIS_ALERT_FROM must be on a domain with Email Routing enabled on the
#      account (wedd.au is; adrianwedd.com is NOT — Google Workspace holds its
#      MX, and onboarding it to Email Routing would break inbound mail).
#   2. CRISIS_ALERT_TO must be a verified Email Routing destination address
#      (adrianwedd@gmail.com was verified 2023) — otherwise E_SENDER_NOT_VERIFIED.
# destination_address below restricts the binding to that one recipient; if
# CRISIS_ALERT_TO ever changes, change destination_address with it. Alerts
# degrade to /api/health surfacing if the binding/vars are absent.
[[send_email]]
name = "CRISIS_EMAIL"
destination_address = "adrianwedd@gmail.com"

[vars]
CRISIS_ALERT_FROM = "alerts@wedd.au"
CRISIS_ALERT_TO = "adrianwedd@gmail.com"
FACEBOOK_PAGE_ID = "35753603727"
GRAPH_API_VERSION = "v21.0"
INSTAGRAM_BUSINESS_ACCOUNT_ID = ""
BLUESKY_HANDLE = "adrianwedd.com"

# Rate limiting binding (#473): 30 req/min per IP+path across /api/*.
# A zone-level WAF rate-limiting rule would drop abuse before worker code,
# but the Workers binding achieves the same budget without WAF-write access.
# GA [[ratelimits]] form — the legacy [[unsafe.bindings]] shape deploys as
# inert "Unsafe Metadata" on current wrangler and the binding never
# materialises (verified 2026-07-03: env.API_RATE_LIMITER undefined, fail-open).
# namespace_id is an arbitrary per-worker-unique numeric label, not a KV id.
# Enforcement is per-colo and eventually consistent (bursts may overshoot).
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
